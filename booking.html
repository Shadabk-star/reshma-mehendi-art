							<div  class="hb-bannarheading">
								<h1>BOOKING</h1>

		<main id="hb-main" class="hb-main hb-haslayout">
			<section id="hb-services" class="hb-services hb-sectionspace hb-haslayout">
				<div class="container">
					<div class="row">
						<div class=" col-xs-12 col-sm-12 col-sm-offset-0 col-md-8 col-md-offset-2">
							<div class="hb-sectionhead">
								<div class="hb-sectiontitle">
									<h2><span>booking calendar</span>
										Book an Appointment
									</h2>
								</div>
							</div>
							<div class="booking-calendar">

    <div class="booking-calendar">

    
        <button type="button" id="prevMonth">
            <i class="fa fa-chevron-left"></i>
        </button>

        <h3 id="monthYear"></h3>

        <button type="button" id="nextMonth">
            <i class="fa fa-chevron-right"></i>
        </button>
    </div>

    <div class="calendar-weekdays">
        <div>MON</div>
        <div>TUE</div>
        <div>WED</div>
        <div>THU</div>
        <div>FRI</div>
        <div>SAT</div>
        <div>SUN</div>
    </div>

    <div id="calendarDays" class="calendar-days"></div>

</div>

<!-- Appointment Box -->
<div id="appointmentBox" class="appointment-box">

    <h3>Book Your Appointment</h3>

    <p>
        Selected Date:
        <strong id="selectedDate"></strong>
    </p>

	<div id="timeSlots" class="time-slots"></div>

    <form id="appointmentForm">

        <div class="form-group">
            <input
                type="text"
                id="customerName"
                class="form-control"
                placeholder="Your Name"
                required>
        </div>

        <div class="form-group">
            <input
                type="tel"
                id="customerPhone"
                class="form-control"
                placeholder="Phone Number"
                required>
        </div>

        <div class="form-group">
            <select id="mehendiType" class="form-control" required>
                <option value="">Select Mehendi Type</option>
                <option value="Bridal Mehendi">Bridal Mehendi</option>
                <option value="Engagement Mehendi">Engagement Mehendi</option>
                <option value="Party Mehendi">Party Mehendi</option>
                <option value="Arabic Mehendi">Arabic Mehendi</option>
                <option value="Simple Mehendi">Simple Mehendi</option>
				<option value="BabyShower  Mehendi">BabyShower  Mehendi</option>
				<option value="Teej Mehendi">Teej Mehendi</option>
				<option value="Karwachauth Mehendi">Karwachauth Mehendi</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <button type="submit" class="hb-btn">
            CONFIRM APPOINTMENT
        </button>

            </form>

             </div>
						</div>
					</div>
				</div>
			</section>
		</main>
